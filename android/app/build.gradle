def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY')
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// Build flags that can be passed to CMake with -P<FLAG>=<ON|OFF> on the gradle command line
def forwardedFlags = [
    "RETRO_DISABLE_PLUS",
    "RETRO_ACCEPT_OLD_SYNTAX",
    "RETRO_UPDATE_CHECKER",
    "RETRO_USE_CURL",
    "RETRO_VANILLA_LIKE",
    "RETRO_FORCE_CASE_INSENSITIVE",
    "RETRO_MOD_LOADER",
    "RETRO_NETWORKING"
]

android {
    ndkVersion "22.1.7171670"
    compileSdkVersion 29
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.decomp.rsdkv4.plus"
        }
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 1
        versionName "1.3.3"
        def cmakeArgs = ["-DAPP_PLATFORM=android-16", "-DANDROID_STL=c++_static", "-DPLATFORM=Android"]
        forwardedFlags.each { flag ->
            if (project.hasProperty(flag))
                cmakeArgs << "-D${flag}=${project.property(flag)}".toString()
        }
        externalNativeBuild {
            cmake {
                arguments(*cmakeArgs)
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }
       
    }
    lintOptions {
        abortOnError false
    }
    
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "com.decomp.rsdkv4.plus.aar"
                    output.outputFile = new File(outputFile.parent, fileName)
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
